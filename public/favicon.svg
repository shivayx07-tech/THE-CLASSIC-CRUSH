<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDEAA8" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#A8751A" />
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12482c" />
      <stop offset="100%" stop-color="#082215" />
    </linearGradient>

    <!-- Tooth bite marks cut out of the second C -->
    <mask id="biteMask">
      <rect width="100" height="100" fill="white" />
      <circle cx="80" cy="42" r="6.2" fill="black" />
      <circle cx="82.5" cy="51" r="5.6" fill="black" />
      <circle cx="77.5" cy="58.5" r="4.8" fill="black" />
    </mask>
  </defs>

  <!-- Outer Circular Crest -->
  <circle cx="50" cy="50" r="46" fill="url(#bg)" stroke="url(#gold)" stroke-width="2.5" />
  <circle cx="50" cy="50" r="41.5" fill="none" stroke="url(#gold)" stroke-width="0.8" stroke-dasharray="2.5 2" opacity="0.75" />

  <!-- Bitten TCC Monogram -->
  <g mask="url(#biteMask)">
    <text
      x="48"
      y="58"
      font-family="'Playfair Display', 'Georgia', serif"
      font-size="26.5"
      font-weight="800"
      letter-spacing="-0.8"
      fill="url(#gold)"
      text-anchor="middle"
    >
      TCC
    </text>
  </g>

  <!-- Floating pastry crumbs -->
  <circle cx="88.5" cy="43.5" r="1.5" fill="#D4AF37" />
  <circle cx="86.5" cy="52" r="1.2" fill="#FDEAA8" />
  <circle cx="83.5" cy="61" r="1.1" fill="#D4AF37" />
  <circle cx="91.5" cy="49.5" r="0.9" fill="#FDEAA8" />
  <path d="M89 55.5 L91 57 L89.2 58 Z" fill="#D4AF37" />
</svg>
